# GitLab CI pipeline for dotfiles
# Migrated from .drone.yml — parallel SAST jobs + behavioral tests
image: alpine:3.20.5@sha256:a180ec8e5c7247c920c91508fa4ce86088946cc9e65f4aeb39091038bba88b0b

stages:
  - sast
  - test
  - label

variables:
  DOTFILES_ROOT: $CI_PROJECT_DIR

# SAST jobs run in parallel for faster feedback
.sast_base:
  stage: sast
  before_script:
    - .ci/scripts/setup.sh sast

shellcheck:
  extends: .sast_base
  script:
    - make shellcheck

shfmt:
  extends: .sast_base
  script:
    - make fmt-check

python-lint:
  extends: .sast_base
  script:
    - make python-lint

# Behavioral tests
.test_base:
  stage: test
  before_script:
    - .ci/scripts/setup.sh

test:
  extends: .test_base
  script:
    - make test

test-zsh:
  extends: .test_base
  script:
    - make test-zsh

# Auto-label MRs based on pipeline result
# Requires GITLAB_API_TOKEN CI/CD variable with api scope
label-success:
  stage: label
  image: alpine:latest
  script:
    - apk add --no-cache curl
    - 'curl --request PUT --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}" --data "labels=ci-passing"'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  when: on_success

label-failure:
  stage: label
  image: alpine:latest
  script:
    - apk add --no-cache curl
    - 'curl --request PUT --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}" --data "labels=ci-failing"'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  when: on_failure
