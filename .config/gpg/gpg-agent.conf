# GPG Agent Configuration
# Optimized for cross-platform (macOS/Linux) SSH authentication via GPG agent

# Cache settings
default-cache-ttl 300
max-cache-ttl 3600
default-cache-ttl-ssh 300

# Enable SSH support
enable-ssh-support

# Security settings
no-grab
disable-scdaemon

# Allow loopback pinentry for headless environments
# This allows passphrase caching without interactive prompts
allow-loopback-pinentry

# Pinentry program selection:
# MANUAL.md mandates bin/pinentry-fallback as the ONLY pinentry path in the
# tracked GPG config. The script resolves the right binary at runtime
# (macOS -> pinentry-mac bundle, Linux -> pinentry-tty, generic -> curses/PATH)
# via command -v / file checks, so there is no hardcoded absolute path here.
# Do NOT hardcode a platform-specific pinentry binary in this file.
pinentry-program ~/.dotfiles/bin/pinentry-fallback
