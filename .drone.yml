kind: pipeline
name: default
type: docker

trigger:
  event:
    - push
    - pull_request

steps:
  - name: test
    image: alpine:latest
    environment:
      DOTFILES_ROOT: /drone/src
    commands:
      - apk add --no-cache bash git python3 py3-yaml zsh make curl ca-certificates age
      - curl -fsSL https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64 -o /tmp/sops
      - chmod +x /tmp/sops
      - mv /tmp/sops /usr/local/bin/sops
      - make test
