kind: pipeline
name: default
type: docker

trigger:
  event:
    - push
    - pull_request

# Shared setup block: installs required tools once and
# fetches/verifies the pinned sops binary.
# Steps reference this block via YAML anchors to avoid duplication.
.common_setup: &common_setup |
  apk add --no-cache bash git python3 py3-yaml zsh make curl ca-certificates age coreutils shellcheck
  curl -fsSL https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64 -o /tmp/sops
  echo "5488e32bc471de7982ad895dd054bbab3ab91c417a118426134551e9626e4e85  /tmp/sops" | sha256sum -c -
  chmod +x /tmp/sops
  mv /tmp/sops /usr/local/bin/sops

steps:
  - name: setup
    image: alpine:latest
    environment:
      DOTFILES_ROOT: /drone/src
    commands:
      - *common_setup

  - name: test
    image: alpine:latest
    environment:
      DOTFILES_ROOT: /drone/src
    depends_on: [setup]
    commands:
      - make test

  - name: sast
    image: alpine:latest
    environment:
      DOTFILES_ROOT: /drone/src
    depends_on: [setup]
    commands:
      - make sast
