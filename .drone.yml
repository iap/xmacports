kind: pipeline
name: default
type: docker

trigger:
  event:
    - push
    - pull_request

steps:
  - name: ci
    image: alpine:3.20.5@sha256:a180ec8e5c7247c920c91508fa4ce86088946cc9e65f4aeb39091038bba88b0b
    environment:
      DOTFILES_ROOT: /drone/src
    commands:
      - scripts/ci-setup.sh sast
      - make sast
      # Behavioural tests must gate CI too. `make sast` only covers static
      # analysis (shellcheck/shfmt/ruff); without this a functional regression
      # in the load chain, PATH handling, or secrets layer would ship green.
      # The sast setup already installs bash, zsh, make, age and coreutils.
      - make test
