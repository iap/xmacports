kind: pipeline
name: default
type: docker

trigger:
  event:
    - push
    - pull_request

steps:
  - name: test
    image: alpine:latest
    environment:
      DOTFILES_ROOT: /drone/src
    commands:
      - bash scripts/ci-setup.sh
      - make test

  - name: sast
    image: alpine:latest
    environment:
      DOTFILES_ROOT: /drone/src
    commands:
      - bash scripts/ci-setup.sh sast
      - make sast
